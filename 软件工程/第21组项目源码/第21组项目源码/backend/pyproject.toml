[project]
name = "bookflow-core"
version = "1.0.0"
description = "BookFlow Core — public library management system backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "uvicorn>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["bookflow_core*"]
exclude = ["data*"]
